

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic Tac Toe 🎀</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #ffe4ef, #f3e8ff);
  color: #823b69;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 380px;
  text-align: center;
  background: rgba(255,255,255,0.8);
  border: 2px solid white;
  border-radius: 28px;
  padding: 24px 18px;
  box-shadow: 0 12px 35px #d98bbd44;
}

h1 {
  margin: 0 0 8px;
  font-size: 32px;
}

.subtitle {
  color: #aa7094;
  margin-bottom: 22px;
}

.scores {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
}

.score-box {
  flex: 1;
  padding: 12px 5px;
  border-radius: 15px;
  background: #fff0f7;
  font-size: 14px;
}

.score-box strong {
  display: block;
  font-size: 25px;
  margin-top: 5px;
}

#status {
  min-height: 28px;
  font-size: 19px;
  font-weight: bold;
  margin: 15px 0;
}

.board {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.cell {
  aspect-ratio: 1;
  border: 0;
  border-radius: 18px;
  background: #fff0f7;
  color: #d94691;
  font-size: 48px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 4px 0 #efc2dc;
  transition: transform .15s, background .15s;
}

.cell:active {
  transform: scale(.94);
}

.cell.o {
  color: #9b76df;
}

.cell.win {
  background: #d8f8e7;
  box-shadow: 0 4px 0 #a5e8c3;
}

.buttons {
  display: flex;
  gap: 10px;
  margin-top: 22px;
}

button.action {
  flex: 1;
  border: 0;
  border-radius: 25px;
  padding: 14px 8px;
  color: white;
  background: #e879ad;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
}

button.action:last-child {
  background: #a78bfa;
}

button:focus-visible {
  outline: 3px solid #823b69;
  outline-offset: 3px;
}

.footer {
  margin-top: 20px;
  font-size: 13px;
  color: #b27d9f;
}
</style>
</head>

<body>
<div class="container">
  <h1>🎀 Tic Tac Toe 🎀</h1>
  <div class="subtitle">A little game, a lot of fun!</div>

  <div class="scores">
    <div class="score-box">
      Player X
      <strong id="scoreX">0</strong>
    </div>
    <div class="score-box">
      Draws
      <strong id="scoreD">0</strong>
    </div>
    <div class="score-box">
      Player O
      <strong id="scoreO">0</strong>
    </div>
  </div>

  <div id="status" aria-live="polite">Player X's turn 💗</div>

  <div class="board" id="board">
    <button class="cell" data-i="0" aria-label="Cell 1"></button>
    <button class="cell" data-i="1" aria-label="Cell 2"></button>
    <button class="cell" data-i="2" aria-label="Cell 3"></button>
    <button class="cell" data-i="3" aria-label="Cell 4"></button>
    <button class="cell" data-i="4" aria-label="Cell 5"></button>
    <button class="cell" data-i="5" aria-label="Cell 6"></button>
    <button class="cell" data-i="6" aria-label="Cell 7"></button>
    <button class="cell" data-i="7" aria-label="Cell 8"></button>
    <button class="cell" data-i="8" aria-label="Cell 9"></button>
  </div>

  <div class="buttons">
    <button class="action" id="restart">🔄 New Round</button>
    <button class="action" id="reset">🗑 Reset Scores</button>
  </div>

  <div class="footer">✨ Besties today, champions forever ✨</div>
</div>

<script>
const cells = [...document.querySelectorAll(".cell")];
const statusText = document.getElementById("status");

let board = Array(9).fill("");
let current = "X";
let finished = false;
let scores = { X: 0, O: 0, D: 0 };

const wins = [
  [0,1,2], [3,4,5], [6,7,8],
  [0,3,6], [1,4,7], [2,5,8],
  [0,4,8], [2,4,6]
];

function play(index) {
  if (finished || board[index] !== "") return;

  board[index] = current;
  cells[index].textContent = current;
  cells[index].classList.toggle("o", current === "O");
  cells[index].setAttribute(
    "aria-label",
    "Cell " + (index + 1) + ": " + current
  );

  const winningLine = wins.find(line =>
    line.every(i => board[i] === current)
  );

  if (winningLine) {
    finished = true;
    winningLine.forEach(i => cells[i].classList.add("win"));
    scores[current]++;
    updateScores();
    statusText.textContent = "🎉 Player " + current + " wins!";
    return;
  }

  if (board.every(cell => cell !== "")) {
    finished = true;
    scores.D++;
    updateScores();
    statusText.textContent = "🤝 It's a draw!";
    return;
  }

  current = current === "X" ? "O" : "X";
  statusText.textContent = "Player " + current + "'s turn 💗";
}

function updateScores() {
  document.getElementById("scoreX").textContent = scores.X;
  document.getElementById("scoreO").textContent = scores.O;
  document.getElementById("scoreD").textContent = scores.D;
}

function newRound() {
  board = Array(9).fill("");
  current = "X";
  finished = false;

  cells.forEach((cell, i) => {
    cell.textContent = "";
    cell.classList.remove("o", "win");
    cell.setAttribute("aria-label", "Cell " + (i + 1));
  });

  statusText.textContent = "Player X's turn 💗";
}

cells.forEach((cell, i) => {
  cell.addEventListener("click", () => play(i));
});

document.getElementById("restart").addEventListener("click", newRound);

document.getElementById("reset").addEventListener("click", () => {
  scores = { X: 0, O: 0, D: 0 };
  updateScores();
  newRound();
});
</script>
</body>
  </html>
