
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic Tac Toe 💜</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;padding:20px 12px;
  display:flex;justify-content:center;align-items:center;
  font-family:Arial,sans-serif;color:#fff;
  background:radial-gradient(circle at top,#4b3375,#171126 70%);
}
.game{width:100%;max-width:420px;text-align:center}
h1{
  font-size:34px;color:#f5dfff;
  text-shadow:0 0 10px #d79cff,0 0 25px #a85cff;
  margin:5px 0 8px;
}
.subtitle{color:#e4d4ff;margin:0 0 18px}
.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
button{
  border:1px solid #c8a0ff;border-radius:12px;padding:11px 14px;
  background:#49316b;color:white;font-size:14px;font-weight:bold;
  cursor:pointer;box-shadow:0 0 10px #9563ce55;
}
button:active{transform:scale(.96)}
.modes{margin-bottom:15px}
.status{
  min-height:42px;margin:12px 0;color:#ffe1ff;font-weight:bold;
  font-size:18px;text-shadow:0 0 9px #d889ff;
}
.board-wrap{position:relative;width:min(88vw,340px);margin:0 auto}
.board{
  display:grid;grid-template-columns:repeat(3,1fr);gap:10px;
}
.cell{
  aspect-ratio:1;border-radius:17px;
  border:1px solid #a98acb;background:#251b3b;
  display:flex;justify-content:center;align-items:center;
  font-size:clamp(48px,15vw,76px);font-weight:900;
  cursor:pointer;transition:transform .15s,background .2s;
  box-shadow:inset 0 0 12px #0005,0 0 8px #b68bff20;
}
.cell:not(:disabled):active{transform:scale(.94)}
.cell:disabled{cursor:default;opacity:1}
.cell.x{color:#c99aff;text-shadow:0 0 7px #d3a4ff,0 0 18px #a14dff,0 0 32px #9b4dff}
.cell.o{color:#ff9ecf;text-shadow:0 0 7px #ffb4dc,0 0 18px #ff65b3,0 0 32px #ff4caa}
.cell.winner{background:#53346e;animation:pulse .7s infinite alternate}
@keyframes pulse{from{box-shadow:0 0 10px #e4b0ff}to{box-shadow:0 0 28px #f2caff, inset 0 0 18px #bd76ff}}
.win-line{
  position:absolute;height:7px;border-radius:8px;
  background:#fff0ff;box-shadow:0 0 9px #fff,0 0 20px #e4a5ff,0 0 35px #d48aff;
  transform-origin:left center;pointer-events:none;display:none;z-index:2;
}
.result{
  min-height:44px;margin:15px 0 5px;font-size:25px;font-weight:900;
  color:#fff;text-shadow:0 0 8px #fff,0 0 18px #e6a0ff,0 0 35px #bd55ff;
  animation:resultGlow .8s infinite alternate;
}
@keyframes resultGlow{from{transform:scale(1);opacity:.85}to{transform:scale(1.04);opacity:1}}
.score{
  display:flex;justify-content:center;gap:20px;flex-wrap:wrap;
  color:#f0ddff;margin:10px 0 16px;font-weight:bold
}
.note{font-size:12px;color:#c8b4df;margin-top:18px;line-height:1.5}
</style>
</head>
<body>
<div class="game">
  <h1>🎮 Tic Tac Toe</h1>
  <p class="subtitle">✨ Glow • Play • Win ✨</p>

  <div class="controls modes">
    <button id="two">👥 2 Players</button>
    <button id="computer">🤖 vs Computer</button>
  </div>
  <div class="controls">
    <button id="music">🎵 Music: OFF</button>
    <button id="sound">🔊 Sound: ON</button>
  </div>

  <div class="status" id="status">Choose a mode to start!</div>
  <div class="board-wrap" id="boardWrap">
    <div class="board" id="board"></div>
    <div class="win-line" id="winLine"></div>
  </div>
  <div class="result" id="result"></div>
  <div class="score">
    <span>❌ X: <b id="scoreX">0</b></span>
    <span>⭕ O: <b id="scoreO">0</b></span>
    <span>Draw: <b id="scoreD">0</b></span>
  </div>
  <div class="controls">
    <button id="newRound">↻ New Round</button>
    <button id="reset">Reset Scores</button>
  </div>
  <p class="note">X glows lavender 💜 • O glows pink 🩷<br>Results stay for a few seconds, then the next round starts automatically.</p>
</div>

<script>
const boardEl=document.getElementById('board');
const statusEl=document.getElementById('status');
const resultEl=document.getElementById('result');
const lineEl=document.getElementById('winLine');
const wrap=document.getElementById('boardWrap');
const cells=[];
const wins=[
 [0,1,2],[3,4,5],[6,7,8],
 [0,3,6],[1,4,7],[2,5,8],
 [0,4,8],[2,4,6]
];

let board=Array(9).fill('');
let turn='X',mode='computer',gameOver=false;
let scores={X:0,O:0,D:0};
let musicOn=false,soundOn=true,audio=null,musicTimer=null;
let roundTimer=null;

for(let i=0;i<9;i++){
 const b=document.createElement('button');
 b.className='cell';b.setAttribute('aria-label','Cell '+(i+1));
 b.addEventListener('click',()=>play(i));
 boardEl.appendChild(b);cells.push(b);
}

function audioReady(){
 if(!audio){
  const AC=window.AudioContext||window.webkitAudioContext;
  if(AC)audio=new AC();
 }
 if(audio&&audio.state==='suspended')audio.resume();
}
function tone(freq,duration=.13,type='sine',volume=.08,delay=0){
 if(!soundOn||!audio)return;
 const osc=audio.createOscillator(),gain=audio.createGain();
 osc.type=type;osc.frequency.value=freq;
 gain.gain.setValueAtTime(volume,audio.currentTime+delay);
 gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+delay+duration);
 osc.connect(gain);gain.connect(audio.destination);
 osc.start(audio.currentTime+delay);
 osc.stop(audio.currentTime+delay+duration);
}
function moveSound(){tone(520,.09,'sine',.07)}
function winSound(){
 [523,659,784,1046].forEach((n,i)=>tone(n,.3,'sine',.09,i*.15));
}
function drawSound(){
 [400,350,300].forEach((n,i)=>tone(n,.2,'triangle',.07,i*.18));
}
function startMusic(){
 stopMusic();audioReady();
 if(!audio)return;
 if(!musicOn)return;
 const melody=[261.6,329.6,392,329.6,293.7,349.2,440,349.2];
 let i=0;
 musicTimer=setInterval(()=>{
  if(!musicOn||!audio)return;
  const osc=audio.createOscillator(),gain=audio.createGain();
  osc.type='sine';osc.frequency.value=melody[i%melody.length];
  gain.gain.value=.025;
  gain.gain.setTargetAtTime(.001,audio.currentTime+.24,.08);
  osc.connect(gain);gain.connect(audio.destination);
  osc.start();osc.stop(audio.currentTime+.5);
  i++;
 },420);
}
function stopMusic(){if(musicTimer)clearInterval(musicTimer);musicTimer=null}

function render(){
 board.forEach((v,i)=>{
  cells[i].textContent=v;
  cells[i].className='cell'+(v?' '+v.toLowerCase():'');
  cells[i].disabled=gameOver||!!v||(mode==='computer'&&turn==='O');
 });
 document.getElementById('scoreX').textContent=scores.X;
 document.getElementById('scoreO').textContent=scores.O;
 document.getElementById('scoreD').textContent=scores.D;
}
function getWinner(){
 for(const combo of wins){
  const [a,b,c]=combo;
  if(board[a]&&board[a]===board[b]&&board[a]===board[c])
   return {player:board[a],combo};
 }
 return null;
}
function drawWinningLine(combo){
 const first=cells[combo[0]],last=cells[combo[2]];
 const x1=first.offsetLeft+first.offsetWidth/2;
 const y1=first.offsetTop+first.offsetHeight/2;
 const x2=last.offsetLeft+last.offsetWidth/2;
 const y2=last.offsetTop+last.offsetHeight/2;
 const dx=x2-x1,dy=y2-y1;
 lineEl.style.left=x1+'px';lineEl.style.top=(y1-3)+'px';
 lineEl.style.width=Math.sqrt(dx*dx+dy*dy)+'px';
 lineEl.style.transform='rotate('+Math.atan2(dy,dx)+'rad)';
 lineEl.style.display='block';
 combo.forEach(i=>cells[i].classList.add('winner'));
}
function finishRound(winner){
 gameOver=true;
 if(winner){
  scores[winner.player]++;
  resultEl.textContent=winner.player+' WINS! ✨';
  statusEl.textContent='Amazing move! 🎉';
  drawWinningLine(winner.combo);
  winSound();
 }else{
  scores.D++;
  resultEl.textContent="IT'S A DRAW! 🤝";
  statusEl.textContent='Well played, both! 💜';
  drawSound();
 }
 render();
 clearTimeout(roundTimer);
 roundTimer=setTimeout(newRound,3500);
}
function play(i){
 if(gameOver||board[i]||(mode==='computer'&&turn==='O'))return;
 audioReady();
 board[i]=turn;moveSound();
 const win=getWinner();
 if(win){finishRound(win);return}
 if(board.every(Boolean)){finishRound(null);return}
 turn=turn==='X'?'O':'X';
 statusEl.textContent=turn+"'s turn";
 render();
 if(mode==='computer'&&turn==='O'){
  cells.forEach(c=>c.disabled=true);
  setTimeout(computerPlay,450);
 }
}
function computerPlay(){
 if(gameOver||mode!=='computer')return;
 let move=chooseMove();
 if(move!==undefined){
  board[move]='O';moveSound();
  const win=getWinner();
  if(win){finishRound(win);return}
  if(board.every(Boolean)){finishRound(null);return}
  turn='X';statusEl.textContent="Your turn (X) 💜";render();
 }
}
// Computer wins if possible, blocks obvious wins, but sometimes takes a risky move.
function chooseMove(){
 const available=board.map((v,i)=>v===''?i:-1).filter(i=>i>=0);
 function winningMove(p){
  for(const i of available){
   board[i]=p;const w=getWinner();board[i]='';
   if(w)return i;
  }
 }
 const win=winningMove('O');if(win!==undefined)return win;
 const block=winningMove('X');if(block!==undefined)return block;
 // Occasionally misses a strategic fork so the game remains beatable.
 if(Math.random()<.24)return available[Math.floor(Math.random()*available.length)];
 if(board[4]==='')return 4;
 const corners=[0,2,6,8].filter(i=>board[i]==='');
 if(corners.length&&Math.random()<.75)return corners[Math.floor(Math.random()*corners.length)];
 return available[Math.floor(Math.random()*available.length)];
}
function newRound(){
 clearTimeout(roundTimer);roundTimer=null;
 board=Array(9).fill('');turn='X';gameOver=false;
 resultEl.textContent='';lineEl.style.display='none';
 statusEl.textContent=mode==='computer'?"Your turn (X) 💜":"X's turn";
 render();
}
function setMode(next){
 mode=next;
 document.getElementById('two').style.background=next==='two'?'#8757ae':'#49316b';
 document.getElementById('computer').style.background=next==='computer'?'#8757ae':'#49316b';
 newRound();
}
document.getElementById('two').onclick=()=>{audioReady();setMode('two')};
document.getElementById('computer').onclick=()=>{audioReady();setMode('computer')};
document.getElementById('newRound').onclick=()=>{audioReady();newRound()};
document.getElementById('reset').onclick=()=>{
 audioReady();scores={X:0,O:0,D:0};newRound();
};
document.getElementById('music').onclick=()=>{
 audioReady();musicOn=!musicOn;
 document.getElementById('music').textContent='🎵 Music: '+(musicOn?'ON':'OFF');
 if(musicOn)startMusic();else stopMusic();
};
document.getElementById('sound').onclick=()=>{
 audioReady();soundOn=!soundOn;
 document.getElementById('sound').textContent=(soundOn?'🔊 Sound: ON':'🔇 Sound: OFF');
};
window.addEventListener('resize',()=>{
 if(gameOver){
  const w=getWinner();if(w)drawWinningLine(w.combo);
 }
});
setMode('computer');
render();
</script>
</body>
</html>
